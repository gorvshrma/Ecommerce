
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudcart-postgres
    environment:
      POSTGRES_DB: cloudcart
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: cloudcart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart -d cloudcart"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [cloudcart]

  backend:
    build:
      context: ../app/backend
    container_name: cloudcart-backend
    environment:
      APP_NAME: CloudCart API
      APP_VERSION: 1.0.0
      ENVIRONMENT: local
      GIT_COMMIT: local
      DATABASE_URL: postgresql+psycopg://cloudcart:cloudcart@postgres:5432/cloudcart
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cloudcart]

  frontend:
    build:
      context: ../app/frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: cloudcart-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [cloudcart]

volumes:
  postgres_data:

networks:
  cloudcart:
    driver: bridge

---
# Source: cloudcart/templates/postgres.yaml
apiVersion: v1
kind: Service
metadata:
  name: shop-cloudcart-postgres
spec:
  clusterIP: None
  selector: {app: shop-cloudcart, component: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
# Source: cloudcart/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shop-cloudcart-postgres
spec:
  serviceName: shop-cloudcart-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: shop-cloudcart, component: postgres}
  template:
    metadata:
      labels: {app: shop-cloudcart, component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: cloudcart}
            - {name: POSTGRES_USER, value: cloudcart}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: cloudcart-database, key: POSTGRES_PASSWORD}
          ports: [{containerPort: 5432, name: postgres}]
          readinessProbe:
            exec: {command: [pg_isready, -U, cloudcart, -d, cloudcart]}
          livenessProbe:
            exec: {command: [pg_isready, -U, cloudcart, -d, cloudcart]}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}

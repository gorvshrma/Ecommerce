name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests with coverage
        run: |
          python -m pytest \
            -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Validate optional Sonar configuration
        if: github.event_name == 'push' && vars.ENABLE_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::ENABLE_SONAR requires the SONAR_TOKEN repository secret"
            exit 1
          fi

      - name: SonarQube Cloud Scan
        if: github.event_name == 'push' && vars.ENABLE_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build backend image
        run: |
          docker build \
            --tag cloudcart-backend:${{ github.sha }} \
            app/backend

      - name: Build frontend image
        run: |
          docker build \
            --tag cloudcart-frontend:${{ github.sha }} \
            app/frontend

  trivy-scan:
    name: Trivy Security Scan (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image for security scan
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker build --tag "cloudcart-${SERVICE}:${IMAGE_TAG}" "app/${SERVICE}"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: "cloudcart-${{ matrix.service }}:${{ github.sha }}"
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Reject tracked state, plans, and private settings
        run: |
          python scripts/test_terraform_hygiene.py
          python scripts/check_terraform_hygiene.py
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate and test with mocked AWS provider
        shell: bash
        run: |
          set -euo pipefail
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
          for stack in bootstrap platform application; do
            terraform -chdir="terraform/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/$stack" validate -no-color
            terraform -chdir="terraform/$stack" test -no-color
          done
      - name: Scan infrastructure without AWS access
        run: |
          docker run --rm -v "$PWD/terraform:/tf:ro" bridgecrew/checkov:3.4.0@sha256:ece5efac4443084ca273072909985dce988a81e8cc94faa305aeda0df27c68f9 \
            --directory /tf --framework terraform --compact --quiet --skip-download

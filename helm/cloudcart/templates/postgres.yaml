{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudcart.name" . }}-postgres
spec:
  clusterIP: None
  selector: {app: {{ include "cloudcart.name" . }}, component: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cloudcart.name" . }}-postgres
spec:
  serviceName: {{ include "cloudcart.name" . }}-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {app: {{ include "cloudcart.name" . }}, component: postgres}
  template:
    metadata:
      labels: {app: {{ include "cloudcart.name" . }}, component: postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: cloudcart}
            - {name: POSTGRES_USER, value: cloudcart}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}
          ports: [{containerPort: 5432, name: postgres}]
          readinessProbe:
            exec: {command: [pg_isready, -U, cloudcart, -d, cloudcart]}
          livenessProbe:
            exec: {command: [pg_isready, -U, cloudcart, -d, cloudcart]}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
{{- end }}

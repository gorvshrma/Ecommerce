{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "cloudcart.name" . }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloudcart.name" . }}-backend
                port: {number: 8000}
          {{- range $path := list "/health" "/ready" "/info" "/metrics" "/docs" "/openapi.json" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloudcart.name" $ }}-backend
                port: {number: 8000}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "cloudcart.name" . }}-frontend
                port: {number: 8080}
{{- end }}

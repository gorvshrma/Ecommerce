production: false
existingSecret: cloudcart-database
frontend:
  image: docker-frontend:latest
  replicas: 1
backend:
  image: docker-backend:latest
  replicas: 1
imagePullPolicy: IfNotPresent
imagePullSecrets: []
corsOrigins: http://localhost:3000,http://localhost:8080
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 2Gi
  storageClass: ""
  externalCidr: ""
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""
  accessControlsVerified: false
  annotations: {}
networkPolicy:
  enabled: true
  ingressNamespace: ingress-system
